<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jot</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <link rel="icon" id="favicon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/manrope.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Navigation"></aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content" id="content" tabindex="-1">
        <header class="hero" id="hero"></header>
        <div class="capture-wrap" id="capture"></div>
        <div id="view"></div>
      </div>
    </main>
    <section id="editor" class="editor" aria-label="Editor" hidden></section>
  </div>
  <div id="bulkbar" class="bulkbar" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="layer"></div>
  <div id="login" class="login" hidden></div>
  <noscript>Jot needs JavaScript.</noscript>
</body>
</html>
